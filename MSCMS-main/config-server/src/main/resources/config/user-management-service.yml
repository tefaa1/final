spring:
  datasource:
    url: ${DB_URI}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/mscms/protocol/openid-connect/certs

server:
  port: 8081
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: "*"

springdoc:
  servers:
    - url: http://localhost:8080
      description: API Gateway
    - url: http://localhost:8081
      description: User Management (direct)

keycloak:
  admin:
    username: ${KEYCLOAK_USER:admin}
    password: ${KEYCLOAK_PASSWORD:admin123}
    server-url: http://keycloak:8080
    realm: mscms
    client-id: admin-cli
    client-uid: ""
    managed-client-id: mscms-frontend

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG

app:
  admin:
    keycloak-id: ${APP_ADMIN_KEYCLOAK_ID:default-admin-id}
    first-name: ${APP_ADMIN_FIRST_NAME:Admin}
    last-name: ${APP_ADMIN_LAST_NAME:User}
    username: ${APP_ADMIN_USERNAME:admin}
    email: ${APP_ADMIN_EMAIL:admin@mscms.com}
    password: ${APP_ADMIN_PASSWORD:admin123}
    phone: ${APP_ADMIN_PHONE:0000000000}
    age: ${APP_ADMIN_AGE:30}
    gender: ${APP_ADMIN_GENDER:MALE}
    address: ${APP_ADMIN_ADDRESS:System}
    blood-type: ${APP_ADMIN_BLOOD_TYPE:O_POSITIVE}
    role: ${APP_ADMIN_ROLE:ADMIN}
    create-default: ${APP_ADMIN_CREATE_DEFAULT:true}
